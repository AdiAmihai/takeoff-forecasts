name: Run forecast now

# The forecast engine of record (v2.0.0).
# - Scheduled: 01:15 and 13:15 UTC = 03:15/15:15 Israel winter time, 04:15/16:15 summer time,
#   always before the claude.ai run (~04:48/16:48) that reads data/forecast.json for the
#   dashboard and phone notification.
# - Manual: GitHub → Actions → "Run forecast now" → Run workflow (also from the mobile app).
on:
  schedule:
    - cron: "15 1 * * *"
    - cron: "15 13 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: forecast-data
  cancel-in-progress: false

jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history, so the criteria commit label is the last edit of config/spots.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Previous windows from the current site data
        run: |
          mkdir -p run
          python3 - <<'EOF'
          import json, pathlib
          p = pathlib.Path("data/forecast.json")
          rows = json.loads(p.read_text())["windows"] if p.exists() else None
          if rows is not None:
              pathlib.Path("run/prev.json").write_text(json.dumps(rows, ensure_ascii=False))
          EOF

      - name: Run engine
        run: |
          PREV=""
          [ -f run/prev.json ] && PREV="--prev run/prev.json"
          COMMIT=$(git log -1 --format=%h -- config/spots.json)
          python3 engine/forecast_alerts.py \
            --spots config/spots.json \
            --fallback-spots engine/spots.json \
            --config-commit "$COMMIT" \
            $PREV \
            --out run/result.json \
            --export-dir run/export | tee run/summary.txt
          {
            echo "### Forecast run"
            echo '```'
            cat run/summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish data
        run: |
          trap 'echo "::error title=Publish failed::line $LINENO: $BASH_COMMAND"' ERR
          cp run/export/forecast.json data/forecast.json
          git config user.name "Adi"
          git config user.email "amihai.adi@gmail.com"
          git add data/forecast.json
          if git diff --cached --quiet; then
            echo "No data change."
            exit 0
          fi
          RUN_AT=$(python3 -c "import json;print(json.load(open('run/result.json'))['run_at'])")
          git commit -q -m "data: forecast $RUN_AT (${{ github.event_name }})"
          for i in 1 2 3; do
            if git pull -q --rebase origin main && git push -q origin HEAD:main; then
              echo "::notice title=Published::forecast $RUN_AT"
              exit 0
            fi
            echo "::warning title=Push retry::attempt $i failed"
            sleep 5
          done
          echo "::error title=Publish failed::could not push after 3 attempts"
          exit 1
